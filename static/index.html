<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>熱血！ニャンコ大運動会 ONLINE 試作</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d1b33;color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif;touch-action:manipulation}button,input{font:inherit}button{cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 14%,#325784,#0b1428 70%)}#top{height:53px;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#091629db;flex-shrink:0;gap:6px}#top strong{font-size:clamp(13px,2.4vw,22px);color:#ffe09c}#status{font-size:clamp(10px,1.7vw,13px);opacity:.9}#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}#game{display:none;max-width:100%;max-height:100%;aspect-ratio:1000/560}#overlay{width:min(800px,94vw);max-height:100%;overflow-y:auto;padding:12px 16px;text-align:center;background:#152d4bef;border:2px solid #f0ca71;border-radius:18px;box-shadow:0 16px 60px #0009}h1{font-size:clamp(24px,4.2vw,44px);margin:6px;color:#ffdc86;text-shadow:2px 3px #a64f42}h2{font-size:clamp(20px,3vw,30px);margin:7px}p{line-height:1.55;margin:7px auto;color:#e2edfc;font-size:clamp(12px,1.7vw,15px)}.button{padding:11px 18px;border:2px solid #fff8;border-radius:13px;background:linear-gradient(#ffe58b,#ffac4a);color:#2d2541;font-weight:1000;min-width:110px;box-shadow:0 4px #a45c30;margin:4px;touch-action:manipulation}.button:disabled{opacity:.4}.secondary{background:#31557c;color:#fff;box-shadow:0 4px #163047}.field{border-radius:12px;border:2px solid #92c6eb;background:#08213f;color:#fff;font-size:22px;font-weight:900;letter-spacing:5px;width:180px;text-align:center;padding:8px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.cat{background:#234368;border:2px solid #7193ab;border-radius:12px;color:white;padding:5px;min-width:0}.cat.selected{border:3px solid #ffe06b;box-shadow:0 0 15px #ffef87a3}.cat:disabled{opacity:.32}.cat img{display:block;object-fit:contain;height:clamp(65px,16vh,135px);width:100%}.cat span{font-size:clamp(10px,1.8vw,16px);font-weight:900}.muted{opacity:.72;font-size:13px}.roomcode{font-size:clamp(24px,5vw,42px);color:#ffffba;letter-spacing:6px;font-weight:1000}.ranks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px auto;max-width:600px}.rank{background:#28476c;border:1px solid #9bbee0;border-radius:12px;padding:10px;font-weight:900}.rank:first-child{background:#805528;border-color:#ffe9a5}#controls{display:none;position:absolute;bottom:12px;left:2%;right:2%;align-items:end;justify-content:space-between;pointer-events:none;z-index:3}.pad{width:clamp(94px,22vh,145px);height:clamp(94px,22vh,145px);border:2px solid #cce9ffba;border-radius:50%;background:#22476ba6;position:relative;pointer-events:auto;touch-action:none}.nub{position:absolute;width:40%;height:40%;border-radius:50%;background:#eee9;left:30%;top:30%;pointer-events:none}.actions{display:flex;gap:8px;pointer-events:auto}.actions button{border:2px solid #fffb;border-radius:50%;background:#e36245;color:#fff;font-size:clamp(11px,2vw,18px);font-weight:1000;width:clamp(74px,17vh,108px);height:clamp(74px,17vh,108px);text-shadow:0 1px 3px #333;touch-action:manipulation}.actions button:nth-child(2){background:#894bd0}.actions button:active{filter:brightness(1.4);transform:scale(.96)}#gameInfo{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#0e2341dc;border:1px solid #ffffff77;padding:7px 13px;border-radius:12px;font-size:clamp(10px,1.7vw,14px);font-weight:900;white-space:nowrap;z-index:2}#tip{position:absolute;top:38px;left:50%;transform:translateX(-50%);font-size:clamp(11px,2.1vw,18px);text-shadow:2px 2px #10243c;pointer-events:none;font-weight:900}#orientation{display:none;position:absolute;inset:0;background:#081b33ed;z-index:50;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;padding:24px}#connection{color:#fff2be;font-size:12px}@media(orientation:portrait) and (max-width:650px){#orientation{display:flex}}@media(max-height:420px){#top{height:40px}#overlay{padding:5px 14px}.cat img{height:85px}.pad{height:90px;width:90px}.actions button{height:75px;width:75px}} 
</style></head><body><div id="app"><header id="top"><strong>🐾 熱血！ニャンコ大運動会 ONLINE</strong><span id="status">通信対戦プロトタイプ</span><span id="connection">未接続</span></header><main id="stage"><canvas width="1000" height="560" id="game"></canvas><div id="gameInfo"></div><div id="tip"></div><div id="overlay"></div><div id="controls"><div id="pad" class="pad"><div id="nub" class="nub"></div></div><div class="actions"><button id="action1">パンチ</button><button id="action2">必殺技</button><button id="action3" style="display:none">投げる</button></div></div><div id="orientation">📱↪️<p>スマホを横向きにしてプレイしてください</p></div></main></div><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');const NAMES=['まるねこ','でぶねこ','ダックス','もふねこ'],SP=['5区間クロスカントリー','4匹乱闘・格闘大会','決戦・綱引き'];const images=['maru.webp','debu.webp','dog.webp','mofu.webp'].map(f=>{let im=new Image();im.src='/assets/'+f;return im});const arena=new Image();arena.src='/assets/arena.jpg';let ws=null,slot=-1,state=null,lastPhase='',lastEvent=-1,me=null,lastSend=0,joy={x:0,y:0},keys={},audioReady=false;let info='',roomCode='',lastStage=1,lastFx='';const music=new Audio('/assets/bgm.mp3');music.loop=true;music.volume=.32;const realSounds={airhorn:'airhorn',cheer:'cheer',gong:'gong',levelup:'levelup'};const fx=Object.fromEntries(Object.entries(realSounds).map(([k,v])=>{const a=new Audio('/assets/'+v+'.mp3');a.volume=.67;return [k,a]}));function playReal(k){const a=fx[k];if(a){a.pause();a.currentTime=0;a.play().catch(()=>{})}}function startMusic(){music.play().catch(()=>{})}const host=location.protocol==='https:'?'wss:':'ws:';
function sound(freq=640,length=.12){try{const c=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(freq,c.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.62,c.currentTime+length);o.type='triangle';g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+length);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+length)}catch{}}
function send(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}function connect(action,code=''){startMusic();if(ws)ws.close();ws=new WebSocket(host+'//'+location.host+'/ws');$('connection').textContent='接続中…';ws.onopen=()=>send({action,code});ws.onclose=()=>{$('connection').textContent='切断';if(state?.phase==='play'){$('tip').textContent='通信が切断されました。ページを更新してください'}};ws.onerror=()=>{$('connection').textContent='通信エラー'};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error'){info=d.message;sound(180,.28);renderHome();return}if(d.type==='joined'){slot=d.slot;roomCode=d.code;me=null;$('connection').textContent='接続済み';sound(800);return}if(d.type==='state'){const prev=state;state=d;if(state.fx){const fresh=state.fx.filter(f=>f.t+'_'+f.id+'_'+f.kind!==lastFx);if(fresh.length){const f=fresh[fresh.length-1];lastFx=f.t+'_'+f.id+'_'+f.kind;if(['headbutt','slaps','whirl','feign','bomb','hit'].includes(f.kind))sound(f.kind==='hit'?210:590,.18)}}if(state.phase!==lastPhase||state.event!==lastEvent){lastPhase=state.phase;lastEvent=state.event;lastStage=state.stage;showState()}else if(state.phase==='play'&&state.event===0&&state.stage!==lastStage){lastStage=state.stage;playReal('airhorn')}else if(state.phase==='lobby')renderLobby();else if(state.phase==='results'&&(!prev||prev.messages!==state.messages))renderResults();updateInfo();}}}
function showOverlay(html){$('overlay').style.display='block';$('overlay').innerHTML=html;$('game').style.display='none';$('controls').style.display='none';$('gameInfo').style.display='none';$('tip').textContent=''}
function renderHome(){showOverlay(`<h1>熱血！ニャンコ大運動会</h1><h2>オンライン 2人対戦・3競技強化版</h2><p>スマホ2台で同じ部屋に入り、CPU2匹を交えた3競技に挑戦！</p><p>専用サーバーが位置・体力・得点を管理します。</p><div><button class="button" onclick="connect('create')">部屋を作る</button></div><p>または部屋コードで参加</p><input class="field" maxlength="6" inputmode="numeric" pattern="[0-9]*" id="code" placeholder="000000"><button class="button secondary" onclick="connect('join',$('code').value)">参加</button>${info?`<p style="color:#ffaaaa">${info}</p>`:''}<p class="muted">※ 通信対戦強化版。旧1人用の演出や複雑なアクションは現在も移植途中です。</p>`)}
function renderLobby(){if(!state)return;const used=new Set(state.peers.map(p=>p.cat).filter(v=>v!==null));const mine=state.peers.find(p=>p.slot===slot);const cards=NAMES.map((name,i)=>`<button class="cat ${mine?.cat===i?'selected':''}" ${used.has(i)&&mine?.cat!==i?'disabled':''} onclick="send({action:'select',cat:${i}})"><img src="/assets/${['maru','debu','dog','mofu'][i]}.webp"><span>${name}</span></button>`).join('');showOverlay(`<h2>🐾 対戦ロビー</h2><div>部屋コード <span class="roomcode">${state.code}</span> <button class="button secondary" onclick="navigator.clipboard?.writeText('${state.code}')">コピー</button></div><p>相手のスマホで同じサイトを開き、6桁コードを入力してください。</p><div class="cards">${cards}</div><p>あなた：${mine?.cat==null?'キャラ未選択':NAMES[mine.cat]} ／ ${mine?.ready?'準備OK！':'準備待ち'}</p><p>参加者 ${state.peers.length}/2 ・ ${state.peers.map(p=>`P${p.slot+1} ${p.cat==null?'未選択':NAMES[p.cat]} ${p.ready?'✅':'⌛'}`).join(' ／ ')}</p><button class="button" ${mine?.cat==null?'disabled':''} onclick="send({action:'ready',ready:${!mine?.ready}})">${mine?.ready?'準備解除':'準備完了！'}</button><p class="muted">2人が準備完了すると、自動的にクロスカントリーが始まります。</p>`)}
function showState(){if(state.phase==='lobby')renderLobby();else if(state.phase==='play'){$('overlay').style.display='none';$('game').style.display='block';$('controls').style.display='flex';$('gameInfo').style.display='block';$('action3').style.display=state.event===1?'block':'none';if(state.event===0){$('action1').textContent='ジャンプ';$('action2').textContent='ダッシュ'}else if(state.event===1){$('action1').textContent='パンチ';$('action2').textContent='必殺技'}else{$('action1').textContent='連打！';$('action2').textContent='リズム';}sound(900,.3);playReal('airhorn')}else if(state.phase==='results'){renderResults();playReal(state.event===1?'gong':'cheer')}else if(state.phase==='final'){renderFinal();playReal('levelup')}}
function myCat(){return state?.peers.find(p=>p.slot===slot)?.cat}
function updateInfo(){if(!state)return;const x=myCat();$('status').textContent=state.phase==='play'?`第${state.event+1}競技 ${SP[state.event]}`:`部屋 ${roomCode}`;if(state.phase!=='play')return;const e=state.entities?.[x];if(!e)return;let text;if(state.event===0)text=`区間 ${state.stage}/5 ・ ${Math.round(e.progress||0)} / 760 m ${state.stage===5?'｜最終障害物ラッシュ！':''}`;else if(state.event===1)text=`残り ${Math.max(0,Math.ceil(60-state.elapsed))} 秒 ｜ HP ${Math.ceil(e.hp)} ｜ 得点 ${e.pts} ｜ 必殺 ${Math.floor(e.charge)}%`;else text=`${state.round===1?'準決勝':'決勝'}｜残り ${Math.max(0,Math.ceil(35-state.elapsed))} 秒 ｜ 連打 ${Math.round(e.energy)} ｜ リズム ${Math.round(e.notes)}`;$('gameInfo').textContent=text;
 if(state.event===1&&state.elapsed>=50)$('tip').textContent=`${Math.max(0,Math.ceil(60-state.elapsed))}`;else if(state.event===2&&state.elapsed>=25)$('tip').textContent=`${Math.max(0,Math.ceil(35-state.elapsed))}`;else $('tip').textContent=''}
function renderResults(){const order=state.order||[];showOverlay(`<h1>🎤 第${state.event+1}競技・結果発表！</h1><p>「熱戦決着！ それでは競技ごとの順位を発表します！」</p><div class="ranks">${order.map((cat,i)=>`<div class="rank">${['🥇','🥈','🥉','4位'][i]} ${NAMES[cat]}　+${[10,6,3,1][i]}点</div>`).join('')}</div><img style="height:clamp(90px,24vh,220px);max-width:40%;object-fit:contain" src="/assets/${['maru','debu','dog','mofu'][order[0]]}.webp"><p>🏆 この競技の優勝は ${NAMES[order[0]]}！</p><p>※ 総合順位は最終競技終了まで非公開です。</p><button class="button" onclick="send({action:'next'})">${state.event===2?'総合順位発表に進む':'次の競技へ'} ▶</button><p class="muted">2人が進行ボタンを押すと次へ進みます。</p>`)}
function renderFinal(){const rank=state.order||[];showOverlay(`<h1>🏆 総合優勝 決定！</h1><p>「3競技を制した総合チャンピオンは…！」</p><h2 style="color:#ffe27a">${NAMES[rank[0]]}！</h2><img src="/assets/${['maru','debu','dog','mofu'][rank[0]]}.webp" style="height:clamp(90px,26vh,230px);max-width:50%;object-fit:contain"><div class="ranks">${rank.map((cat,i)=>`<div class="rank">${i+1}位 ${NAMES[cat]}　${state.scores[cat]}点</div>`).join('')}</div><p>3競技すべて終了。おつかれさまでした！</p><button class="button" onclick="location.reload()">新しい大会を作る</button>`)}
function drawSprite(im,x,y,w=90){if(im.complete&&im.naturalWidth)ctx.drawImage(im,x-w/2,y-w*.9,w,w*.9);else{ctx.fillStyle='#fff';ctx.font='50px serif';ctx.fillText('🐱',x-w/2,y)}}
function paint(){requestAnimationFrame(paint);if(!state||state.phase!=='play')return;const {event,entities}=state;ctx.clearRect(0,0,1000,560);ctx.save();if(event===1){if(arena.complete&&arena.naturalWidth)ctx.drawImage(arena,0,0,1000,560);else{ctx.fillStyle='#c29b66';ctx.fillRect(20,60,960,460)}ctx.fillStyle='#0008';ctx.fillRect(0,0,1000,58);ctx.font='bold 19px system-ui';ctx.textAlign='left';const list=Object.values(entities).sort((a,b)=>b.pts-a.pts);list.forEach((e,j)=>{ctx.fillStyle=e.id===myCat()?'#ffe46c':'#fff';ctx.fillText(`${j+1} ${NAMES[e.id]} ${e.pts}点`,20+j*245,35)});for(const it of state.items||[]){if(it.taken)continue;ctx.font='34px serif';ctx.fillText(it.kind==='fish'?'🐟':'💣',it.x,it.y)}for(const e of Object.values(entities).sort((a,b)=>a.y-b.y)){if(e.respawn>0)continue;ctx.save();ctx.translate(e.x,e.y+75);if(e.charge>=100){let r=40+5*Math.sin(Date.now()/160);ctx.strokeStyle='#e3dc83aa';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(0,-52,r,60,0,0,Math.PI*2);ctx.stroke()}drawSprite(images[e.id],0,0,100);if(e.weapon){ctx.font='28px serif';ctx.fillText('💣',32,-30)}ctx.fillStyle='#142033';ctx.fillRect(-42,-111,84,9);ctx.fillStyle=e.hp>45?'#4ae58b':'#ff6848';ctx.fillRect(-42,-111,Math.max(0,e.hp)/100*84,9);ctx.fillStyle=e.id===myCat()?'#ffed57':'white';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText(e.id===myCat()?'YOU':(state.peers.some(p=>p.cat===e.id)?'P2':'CPU'),0,-118);ctx.restore()}}
else if(event===0){ctx.fillStyle='#90c9f4';ctx.fillRect(0,0,1000,560);ctx.fillStyle='#738ca5';ctx.fillRect(0,90,1000,360);ctx.fillStyle='#5b665d';ctx.fillRect(0,460,1000,100);for(let i=0;i<4;i++){const y=125+i*98;ctx.fillStyle=i%2?'#a9bac5':'#cad6da';ctx.fillRect(0,y,1000,85);for(let k=0;k<25;k++){ctx.fillStyle='#fff7';ctx.fillRect(k*42,y+43,23,2)}const e=entities[i];const x=75+(e?.progress||0)/760*845;for(const ob of state.obstacles||[]){if(ob.lane!==i)continue;ctx.font='24px serif';ctx.fillText(ob.kind==='banana'?'🍌':ob.kind==='cone'?'🚧':ob.kind==='hurdle'?'🪵':'📦',75+ob.x/760*845,y+63)}for(const it of state.items||[]){if(it.lane===i&&!it.taken){ctx.font='30px serif';ctx.fillText('🛹',75+it.x/760*845,y+57)}}ctx.fillStyle='#222';ctx.fillRect(70,y+72,840,3);drawSprite(images[i],Math.min(900,x),y+80-((e?.jump||0)>0?33:0),67);if((e?.skate||0)>0){ctx.fillStyle='#2646bb';ctx.fillRect(Math.min(900,x)-35,y+72,65,7)}ctx.font='bold 14px system-ui';ctx.fillStyle=i===myCat()?'#ab2424':'#102239';ctx.fillText(`${NAMES[i]} ${Math.round(e?.progress||0)}m`,20,y+18)}}
else{ctx.fillStyle='#90b6d5';ctx.fillRect(0,0,1000,560);ctx.fillStyle='#8bae6b';ctx.fillRect(0,290,1000,270);ctx.fillStyle='#dbbc84';ctx.fillRect(0,365,1000,195);ctx.strokeStyle='#f6ddab';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(130,340);ctx.lineTo(870,340);ctx.stroke();ctx.setLineDash([12,12]);ctx.strokeStyle='#ffecb5';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(500,300);ctx.lineTo(500,380);ctx.stroke();ctx.setLineDash([]);const [a,b]=state.duel;const left=entities[a],right=entities[b];if(left&&right){drawSprite(images[a],280,350,210);drawSprite(images[b],720,350,210);ctx.fillStyle='#132943ee';ctx.fillRect(225,410,550,55);const power=e=>Math.round(e.energy*.87+e.notes*.65);ctx.fillStyle='#91d9ff';ctx.fillRect(235,425,Math.min(250,power(left)*1.8),18);ctx.fillStyle='#fa7864';ctx.fillRect(765-Math.min(250,power(right)*1.8),445,Math.min(250,power(right)*1.8),18);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 25px system-ui';ctx.fillText(`${NAMES[a]} vs ${NAMES[b]}`,500,72);ctx.font='bold 18px system-ui';ctx.fillText(`${power(left)} 力`,315,405);ctx.fillText(`${power(right)} 力`,685,405)}ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.fillStyle='#173251';ctx.fillText('🟡 リズム：残り時間に合わせて約0.9秒ごとに押す',500,520)}ctx.restore()}
paint();
// Virtual joystick. All input sent to server at most 20Hz.
const pad=$('pad'),nub=$('nub');let pid=null;function stick(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,rad=r.width*.39,amp=Math.min(1,Math.hypot(dx,dy)/rad),a=Math.atan2(dy,dx);joy={x:Math.cos(a)*amp,y:Math.sin(a)*amp};nub.style.left=30+joy.x*31+'%';nub.style.top=30+joy.y*31+'%';send({action:'input',kind:'move',detail:joy})}function unst(){joy={x:0,y:0};nub.style.left='30%';nub.style.top='30%';send({action:'input',kind:'move',detail:joy});pid=null}pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;pad.setPointerCapture(pid);stick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)stick(e)});for(const n of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(n,e=>{if(e.pointerId===pid)unst()});
const act1=$('action1'),act2=$('action2'),act3=$('action3');function action(n){if(!state||state.phase!=='play')return;let kind=state.event===0?(n===1?'jump':'dash'):state.event===1?(n===1?'punch':n===2?'special':'throw'):(n===1?'mash':'rhythm');send({action:'input',kind});sound(n===1?320:670,.075)}for(const [el,n] of [[act1,1],[act2,2],[act3,3]]){el.addEventListener('pointerdown',e=>{e.preventDefault();action(n)});el.addEventListener('contextmenu',e=>e.preventDefault())}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(!e.repeat&&[' ','j'].includes(e.key.toLowerCase()))action(1);if(!e.repeat&&['k','u'].includes(e.key.toLowerCase()))action(2);if(!e.repeat&&['l'].includes(e.key.toLowerCase()))action(3)});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});setInterval(()=>{if(!state||state.phase!=='play')return;const x=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),y=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(x||y||joy.x||joy.y)send({action:'input',kind:'move',detail:{x:x||joy.x,y:y||joy.y}})},65);window.addEventListener('blur',()=>{keys={};unst()});renderHome();
</script></body></html>
