y=dy/m;nub.style.left=(50+stick.x*28)+'%';nub.style.top=(50+stick.y*28)+'%'}pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;pad.setPointerCapture(pid);pos(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)pos(e)});function clearPad(e){if(e.pointerId!==pid)return;pid=null;stick.x=0;stick.y=0;nub.style.left='50%';nub.style.top='50%'}pad.addEventListener('pointerup',clearPad);pad.addEventListener('pointercancel',clearPad);pad.addEventListener('lostpointercapture',()=>{pid=null;stick.x=stick.y=0;nub.style.left='50%';nub.style.top='50%'});for(const [btn,action] of [['atk',()=>atkReq=true],['throw',()=>throwReq=true],['jump',()=>jumpReq=true],['special',()=>{specialReq=true;if(fighters[SELECTED].specialCharge\u003c100)pop('必殺ゲージ '+Math.floor(fighters[SELECTED].specialCharge)+'% / 100%')}]]){document.querySelector('#'+btn).addEventListener('pointerdown',e=>{e.preventDefault();action()})}reset();requestAnimationFrame(loop);\n})();\n\u003c/script>\n\u003cscript>window.addEventListener('message',e=>{if(e.data?.source==='nyanko-hub'&&e.data.type==='start'){if(typeof start==='function')start()}});window.parent.postMessage({source:'nyanko-event',type:'ready'},'*');\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ja\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\u003ctitle>ニャンコ大運動会 第3競技 綱引き\u003c/title>\u003cstyle>\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#89cce8;color:white;font-family:system-ui,sans-serif;touch-action:none;user-select:none}canvas{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#132b46d9;border:2px solid #ffffff55;border-radius:15px;padding:7px 16px;text-align:center;min-width:min(65vw,550px);font-weight:900;text-shadow:1px 2px #071b2a;pointer-events:none}#status{font-size:clamp(10px,1.9vw,19px)}#meter{height:11px;border-radius:9px;background:linear-gradient(to right,#57cfff 0 50%,#fa8973 50% 100%);border:2px solid white;position:relative;margin-top:5px}#needle{position:absolute;left:50%;top:-5px;height:17px;width:5px;background:#ffef61;box-shadow:0 0 6px #fff;border-radius:3px;transform:translateX(-50%)}#bottom{position:absolute;left:0;right:0;bottom:max(5px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:10px;padding:4px max(14px,env(safe-area-inset-right)) 4px max(14px,env(safe-area-inset-left));pointer-events:none}#mash,#rhythm{pointer-events:auto;touch-action:none;border:4px solid #fff7;border-radius:26px;color:#fff;text-shadow:1px 2px #0008;box-shadow:0 7px 0 #0006,0 12px 21px #0003;min-height:clamp(69px,17vh,106px);width:clamp(115px,24vw,210px);font-weight:1000;font-size:clamp(16px,3vw,24px);cursor:pointer}#mash{background:linear-gradient(#ffb647,#fa6a34)}#rhythm{background:linear-gradient(#a58aff,#6746dd)}#rhythm:active,#mash:active{transform:translateY(4px);box-shadow:0 3px 0 #0006}#rhythmPanel{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:clamp(102px,24vh,150px);height:66px;width:min(37vw,350px);border-radius:16px;background:#152744df;border:2px solid #fff8;padding:9px;pointer-events:none}#track{height:31px;position:relative;border-radius:8px;background:#2d496c;overflow:hidden;border:1px solid #ffffff44}#sweet{position:absolute;left:45%;width:10%;top:0;bottom:0;background:#6fdb84a0;border-left:2px solid #d6ffd8;border-right:2px solid #d6ffd8}#dot{position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;background:#ffee77;box-shadow:0 0 12px #ffed6a}#rhythmHint{font-size:11px;text-align:center;margin-top:3px;color:#d9eaff}#feedback{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(17px,4vw,34px);font-weight:1000;text-shadow:2px 3px 2px #20334a;pointer-events:none;opacity:0}#overlay{position:absolute;inset:0;background:#092039b9;display:flex;justify-content:center;align-items:center;padding:20px;z-index:4}#panel{background:linear-gradient(#183e5e,#12273d);border:3px solid #ffcb69;border-radius:25px;padding:clamp(13px,3vw,28px);width:min(590px,94vw);max-height:90vh;overflow:auto;text-align:center;box-shadow:0 18px 42px #0007}h1{font-size:clamp(21px,4vw,32px);margin:0 0 12px;color:#ffdf87}p{line-height:1.65;margin:6px 0 12px}.go{padding:13px 40px;background:#ffcd58;border:0;border-radius:16px;color:#35251c;font-size:19px;font-weight:1000;cursor:pointer}#orientation{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;color:#163b4a99;pointer-events:none}@media (orientation:portrait){#rhythmPanel{width:43vw;bottom:117px}#mash,#rhythm{width:43vw}#hud{min-width:80vw}} \n\n#rhythmPanel{height:98px;width:min(43vw,410px);bottom:clamp(95px,23vh,145px);padding:8px 10px}\n#track{height:53px;overflow:hidden;background:linear-gradient(#172e51,#263f65);border:2px solid #9dc9ee}\n#sweet{left:15%;width:10%;background:#83f7ac45;border-left:4px solid #cbffbb;border-right:3px solid #cbffbb}\n#dot{display:none}\n#notes{position:absolute;inset:0;pointer-events:none}\n.note{position:absolute;top:11px;width:27px;height:27px;border-radius:50%;background:#ff785b;border:4px solid #fff2aa;box-shadow:0 0 0 3px #e45546,0 0 12px #ff9d65}\n#rhythmHint{font-size:clamp(10px,1.35vw,13px);margin-top:4px}\n#powers{margin-top:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.powerUnit{font-size:clamp(10px,1.4vw,13px);text-align:left}\n.powerTrack{height:9px;border:1px solid #a8c8e0;border-radius:8px;background:#263955;overflow:hidden}\n.powerFill{height:100%;width:0;background:#ffc563;transition:width .07s}\n#powerTotal{color:#fff3ad;font-size:clamp(14px,2vw,20px);margin-top:4px}\n#hud{min-width:min(74vw,680px)}\n#mash:active{filter:brightness(1.35)}\n#mash{transition:background .07s;box-shadow:0 7px 0 #623e28,0 12px 21px #0003}\n@media(orientation:portrait){#rhythmPanel{width:47vw;bottom:125px}#hud{min-width:94vw}}\n.bracket{line-height:1.9;margin:10px auto;padding:10px;background:#11283d;border-radius:10px;font-size:clamp(12px,1.9vw,16px)}\n\n/* v16: guard against mobile viewport/rotation layout split */\nhtml,body{position:fixed!important;inset:0!important;min-width:0!important;min-height:0!important;width:100%!important;height:100%!important;overflow:hidden!important;contain:layout size!important;overscroll-behavior:none!important}\n#game{position:fixed!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;z-index:0!important}\n#hud{z-index:3;box-sizing:border-box;width:min(74vw,680px)!important;min-width:0!important;max-width:calc(100vw - 18px)!important;left:50%!important;right:auto!important;top:5px!important;transform:translateX(-50%)!important;overflow:hidden!important;padding:4px 9px!important}\n#powers{gap:4px!important;margin-top:3px!important}#powerTotal{font-size:clamp(10px,1.5vw,16px)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n#rhythmPanel{z-index:2;max-width:43vw!important;box-sizing:border-box}#bottom{z-index:3;box-sizing:border-box}\n#overlay{position:fixed!important;inset:0!important;z-index:10!important}\n@media(max-height:420px){#hud{top:2px!important;padding:2px 7px!important}#status{font-size:clamp(10px,1.3vw,15px)}#powerTotal{margin-top:1px!important}#rhythmPanel{bottom:85px!important;height:77px!important}#track{height:40px!important}.note{top:4px!important}}\n\u003c/style>\u003c/head>\u003cbody>\u003ccanvas id=\"game\">\u003c/canvas>\u003cdiv id=\"finalCountdown\" aria-live=\"off\" style=\"position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;display:none;font:1000 clamp(56px,16vh,128px) system-ui;color:#ffe978;text-shadow:0 4px 0 #a32929,0 0 30px #e5ac21,0 7px 12px #000b;text-align:center\">\u003c/div>\u003cdiv id=\"hud\">\u003cdiv id=\"status\">準決勝①　まるねこ vs もふねこ\u003c/div>\u003cdiv id=\"meter\">\u003cdiv id=\"needle\">\u003c/div>\u003c/div>\u003cdiv id=\"powers\">\u003cdiv class=\"powerUnit\">✊連打 \u003cspan id=\"mashValue\">0\u003c/span>\u003cdiv class=\"powerTrack\">\u003cdiv class=\"powerFill\" id=\"mashFill\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"powerUnit\">🎵リズム \u003cspan id=\"rhythmValue\">0\u003c/span>\u003cdiv class=\"powerTrack\">\u003cdiv class=\"powerFill\" id=\"rhythmFill\" style=\"background:#aa92ff\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"powerUnit\">💪自分 \u003cspan id=\"blueValue\">0\u003c/span>\u003cdiv class=\"powerTrack\">\u003cdiv class=\"powerFill\" id=\"blueFill\" style=\"background:#57d7fc\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"powerTotal\">まるねこ 0 vs CPU 0\u003c/div>\u003c/div>\u003cdiv id=\"feedback\">\u003c/div>\u003cdiv id=\"rhythmPanel\">\u003cdiv id=\"track\">\u003cdiv id=\"sweet\">\u003c/div>\u003cdiv id=\"notes\">\u003c/div>\u003c/div>\u003cdiv id=\"rhythmHint\">赤い音符が左の緑ラインに重なったら押す！\u003c/div>\u003c/div>\u003cdiv id=\"bottom\">\u003cbutton id=\"mash\">✊ 連打！\u003csmall style=\"display:block;font-size:11px\">何度も押す\u003c/small>\u003c/button>\u003cbutton id=\"rhythm\">🎵 リズム！\u003csmall style=\"display:block;font-size:11px\">タイミングよく押す\u003c/small>\u003c/button>\u003c/div>\u003cdiv id=\"orientation\">スマホ横画面推奨\u003c/div>\u003cdiv id=\"overlay\">\u003cdiv id=\"panel\">\u003ch1>🐱 第3競技 ニャンコ綱引き！\u003c/h1>\u003cp>4匹による1対1トーナメント！ 準決勝① まるねこ vs もふねこ／準決勝② でぶねこ vs ダックス\u003c/p>\u003cp>左下は連打を続け、右側は\u003cb>速さが変わる音符\u003c/b>をタイミングよく叩こう。見逃し・空打ちでリズムパワーが大幅に減る！\u003cbr>成功で大きな追加パワー、失敗すると少しだけパワーダウン。\u003c/p>\u003cp>準決勝に勝ったらCPU同士の準決勝結果を発表し、決勝へ進出。\u003cbr>1試合30秒、先に綱を引ききるか終了時に優勢な方が勝ち。PCは連打：スペース・リズム：J。\u003c/p>\u003cbutton class=\"go\" id=\"start\">試合開始！\u003c/button>\u003c/div>\u003c/div>\u003cscript>const SELECTED = __PLAYER_ID__;\nfunction nySE(type){try{window.parent.postMessage({source:'nyanko-sfx',type},'*')}catch(e){}}\n\n\nconst DATA={\"standard_idle\": \"assets/5515e9179d1437648fea.webp\", \"power_idle\": \"assets/ae421fe68688eec5453b.webp\", \"dog_idle\": \"assets/40296cbd83827e0eb9c1.webp\", \"fluff_idle\": \"assets/88a49510d1526f5c7bd7.webp\"};Object.assign(DATA,{standard_tug:'assets/1e65c0b125c9d32ff763.webp',power_tug:'assets/c729719252327e505abf.webp',dog_tug:'assets/baf939f89d869a56b615.webp',fluff_tug:'assets/84a5082c6b974d6ae74f.webp',standard_tug2:'assets/7e071615afea085bfe15.webp'});;const sprites={};for(const [k,v] of Object.entries(DATA)){let i=new Image();i.src=v;sprites[k]=i}\nconst c=document.getElementById('game'),g=c.getContext('2d'),\nstatus=document.getElementById('status'),needle=document.getElementById('needle'),\nfeedback=document.getElementById('feedback'),overlay=document.getElementById('overlay'),\npanel=document.getElementById('panel'),notesEl=document.getElementById('notes');\nconst ui={mashValue:document.getElementById('mashValue'),rhythmValue:document.getElementById('rhythmValue'),\nblueValue:document.getElementById('blueValue'),mashFill:document.getElementById('mashFill'),\nrhythmFill:document.getElementById('rhythmFill'),blueFill:document.getElementById('blueFill'),\ntotal:document.getElementById('powerTotal')};\nlet W=0,H=0,dpr=1,last=0,t=0,round=1,wins=[0,0],shift=0,mashPower=0,rhythmPower=0,\npenalty=0,running=false,transition=false,elapsed=0,hitCount=0,missCount=0,particles=[],\nnotes=[],nextNoteAt=0,lastMashAt=-100,feedbackEnd=0,pressFlash=0,streak=0,stumble=0,beatStep=0;\nlet opponent=0,finalOpponent=null,semiWinner=null,champion=null,cpuPower=83;\nconst names=['まるねこ','でぶねこ','ダックス','もふねこ'];\nconst keys=['standard_tug','power_tug','dog_tug','fluff_tug'];const playerId=SELECTED;const firstRival=[3,2,1,0][playerId];const otherPair=[0,1,2,3].filter(id=>id!==playerId&&id!==firstRival);\nfunction cpuSemi(){// Strong, style-dependent CPU-versus-CPU semifinal\n const power=86+Math.random()*24,dog=86+Math.random()*24;\n return power>=dog?1:2;\n}\nconst roundSeconds=36,limit=390,travelTime=1.85,beatInterval=.88;\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nfunction resize(){\n const box=c.getBoundingClientRect();\n const w=Math.max(1,Math.round(box.width||document.documentElement.clientWidth||innerWidth));\n const h=Math.max(1,Math.round(box.height||document.documentElement.clientHeight||innerHeight));\n const ratio=Math.min(devicePixelRatio||1,2);\n if(W!==w||H!==h||dpr!==ratio||c.width!==Math.round(w*ratio)||c.height!==Math.round(h*ratio)){\n W=w;H=h;dpr=ratio;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);\n }\n}\naddEventListener('resize',resize);addEventListener('orientationchange',()=>requestAnimationFrame(resize));\nif(window.visualViewport)visualViewport.addEventListener('resize',resize);\nif(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(c);\nresize();\nfunction scheduleNotes(){while(nextNoteAt\u003celapsed+travelTime+1){notes.push({at:nextNoteAt,judged:false});beatStep++;const speedup=elapsed>20?.84:elapsed>10?.93:1;const pattern=[1,1,.78,1.15,.88,1.05,.79,1.10];nextNoteAt+=beatInterval*speedup*pattern[beatStep%pattern.length]}}\nfunction startRound(){window.parent.postMessage({source:'nyanko-uploaded-audio',type:'airhorn'},'*');\n shift=0;elapsed=0;mashPower=0;rhythmPower=0;penalty=0;hitCount=0;missCount=0;streak=0;stumble=0;beatStep=0;\n cpuPower=(opponent===3?76:opponent===1?101:108);\n notes=[];nextNoteAt=2.0;lastMashAt=-100;particles=[];running=true;transition=false;\n overlay.style.display='none';feedback.style.opacity='0';last=performance.now();scheduleNotes();renderHud();\n}\nfunction start(){wins=[0,0];round=1;opponent=firstRival;finalOpponent=null;semiWinner=null;champion=null;t=0;startRound()}\nfunction feedbackText(txt,good){feedback.textContent=txt;feedback.style.color=good?'#d8ff76':'#ffb2a5';feedback.style.opacity='1';feedbackEnd=t+.65}\nfunction mash(){\n if(!running)return;nySE('mash');\n const now=performance.now()/1000;\n if(now-lastMashAt\u003c.055)return;lastMashAt=now;\n mashPower=clamp(mashPower+6.1,0,95);\n pressFlash=.18;\n for(let i=0;i\u003c5;i++)particles.push({x:W*.35,y:H*.57,vx:(Math.random()-.5)*170,vy:-60-Math.random()*100,life:.45,color:'#fff2a5'});\n renderHud();\n}\nfunction rhythm(){\n if(!running)return;nySE('rhythmTap');\n const pending=notes.filter(n=>!n.judged).sort((a,b)=>Math.abs(a.at-elapsed)-Math.abs(b.at-elapsed))[0];\n if(!pending){penalizeRhythm('空打ち');return}\n const delta=Math.abs(elapsed-pending.at);\n if(delta\u003c=.095){pending.judged=true;streak++;stumble=Math.max(0,stumble-.25);rhythmPower=clamp(rhythmPower+17+Math.min(streak,5)*.8,0,92);hitCount++;nySE('perfect');feedbackText('PERFECT! '+streak+'連続',true)}\n else if(delta\u003c=.19){pending.judged=true;streak++;stumble=Math.max(0,stumble-.15);rhythmPower=clamp(rhythmPower+10+Math.min(streak,5)*.5,0,92);hitCount++;nySE('good');feedbackText('GOOD! '+streak+'連続',true)}\n else{penalizeRhythm('MISS!')}\n renderHud();\n}\nfunction penalizeRhythm(label){nySE('miss');streak=0;rhythmPower=Math.max(0,rhythmPower-17);penalty=clamp(penalty+11,0,45);stumble=clamp(stumble+.75,0,2.8);missCount++;feedbackText(label+' パワーダウン',false)}\nconst bind=(id,fn)=>{let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn()},{passive:false});el.addEventListener('contextmenu',e=>e.preventDefault())};\nbind('mash',mash);bind('rhythm',rhythm);\naddEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();mash()}if(k==='j')rhythm()});\ndocument.getElementById('start').onclick=start;\nfunction results(win){\n running=false;transition=true;\n const didWin=win===0;\n if(round===1){\n   window.parent.postMessage({source:'nyanko-uploaded-audio',type:'cheer'},'*');\n   semiWinner=didWin?playerId:firstRival;\n   const a=otherPair[0],b=otherPair[1];\n   const rating=[88,108,112,78];\n   finalOpponent=(rating[a]+Math.random()*28>=rating[b]+Math.random()*28)?a:b;\n   const otherLoser=otherPair.find(id=>id!==finalOpponent);\n   if(didWin){\n     panel.innerHTML=`\u003ch1>🎉 決勝進出！\u003c/h1>\u003cp>${names[playerId]} vs ${names[finalOpponent]}\u003c/p>\u003cp>準決勝②：${names[finalOpponent]} が勝利\u003c/p>\u003cbutton class=\"go\" id=\"again\">決勝へ ▶\u003c/button>`;\n   }else{\n     // Player loses their semi: record fourth/third via the other semifinal loser.\n     const third=Math.random()>.5?playerId:otherLoser, fourth=third===playerId?otherLoser:playerId;\n     const order=[finalOpponent,semiWinner,third,fourth];\n     window.parent.postMessage({source:'nyanko-event',type:'complete',event:2,order},'*');\n     panel.innerHTML=`\u003ch1>準決勝敗退\u003c/h1>\u003cp>${names[semiWinner]} と ${names[finalOpponent]} が決勝進出\u003c/p>\u003cp>大会の順位を確定しました。\u003c/p>\u003cbutton class=\"go\" id=\"again\">再挑戦\u003c/button>`;\n   }\n }else{\n   const champion=didWin?playerId:opponent,runnerUp=didWin?opponent:playerId;\n   const otherLoser=otherPair.find(id=>id!==opponent);\n   const third=Math.random()>.5?firstRival:otherLoser,fourth=third===firstRival?otherLoser:firstRival;\n   const order=[champion,runnerUp,third,fourth];\n   window.parent.postMessage({source:'nyanko-event',type:'complete',event:2,order},'*');\n   panel.innerHTML=`\u003ch1>${didWin?'🏆 優勝！':'決勝終了！'}\u003c/h1>\u003cp>優勝：${names[champion]}\u003c/p>\u003cbutton class=\"go\" id=\"again\">再挑戦\u003c/button>`;\n }\n overlay.style.display='flex';\n document.getElementById('again').onclick=round===1&&didWin?()=>{round=2;opponent=finalOpponent;startRound()}:start;\n}\nfunction forces(){\n // Balanced for a longer tug-of-war round with stronger rapid tapping influence.\n const cpu=cpuPower+4+Math.sin(t*2.0+opponent)*7+Math.sin(t*.72+opponent*2)*5+(elapsed>12?4:0);\n const your=(18+mashPower*.88+rhythmPower*.72-penalty)*(1-Math.min(.28,stumble*.09));\n return {left:Math.max(0,your),right:cpu,ally:0,cpu};\n}\nfunction renderHu
