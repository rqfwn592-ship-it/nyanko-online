<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ニャンコ大運動会 原作ONLINE v2.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c33;color:white;font-family:system-ui}#lobby{height:100dvh;display:flex;align-items:center;justify-content:center;overflow:auto;background:linear-gradient(120deg,#1d345c,#153a58)}#card{width:min(640px,94vw);padding:24px;border:2px solid #e9bf6c;border-radius:25px;text-align:center;background:#172945f1}button,input{padding:13px;border-radius:12px;margin:5px;background:#efc86d;border:0;font-weight:bold}input{background:white}button{cursor:pointer}button:disabled{opacity:.4}.choice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.choice button{min-width:90px}#game{position:fixed;inset:0;width:100vw;height:100dvh;border:0;display:none;background:black}#pad{position:fixed;bottom:16px;left:16px;width:134px;height:134px;border:2px solid #fffc;border-radius:100px;background:#2b5575e0;display:none;touch-action:none;z-index:8}#buttons{position:fixed;bottom:18px;right:10px;display:none;gap:6px;z-index:8}#buttons button{border-radius:40px;background:#e99623ed;color:white;font-size:13px;touch-action:none}#notice{position:fixed;top:7px;left:50%;transform:translateX(-50%);background:#10243fdf;border-radius:12px;padding:5px 12px;display:none;z-index:8;font-size:12px}#leave{position:fixed;top:8px;right:8px;display:none;z-index:9;font-size:12px}
#tugControls{position:fixed;bottom:15px;left:0;right:0;display:none;z-index:20;justify-content:space-around;pointer-events:none}#tugControls button{width:min(38vw,260px);height:92px;background:#e76c39;color:white;font-size:24px;box-shadow:0 6px #0009;touch-action:none;pointer-events:auto}#tugControls button:last-child{background:#7054d8}

#titleScreen,#selectScreen{position:fixed;inset:0;z-index:65;background:#07152c;display:none;overflow:hidden}
#titleScreen{display:flex}
.lobby-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.art-shade{position:absolute;inset:0;background:linear-gradient(180deg,#06122b33 0%,transparent 42%,#07142aee 100%);pointer-events:none}
.menu-bottom{position:absolute;bottom:max(5px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;width:95%;text-align:center}
.menu-action{background:linear-gradient(#ffec91,#eaa63f);color:#402415;border:3px solid white;padding:10px 30px;box-shadow:0 5px 18px #0009;font-weight:1000;font-size:clamp(17px,3vw,26px);white-space:nowrap}
.menu-sub{font-weight:900;color:#fff;text-shadow:0 3px 5px #001,0 0 8px #001;font-size:clamp(11px,1.6vw,15px)}
#selectScreen .menu-bottom{bottom:max(3px,env(safe-area-inset-bottom))}
#selectScreen .choose-row{display:flex;gap:clamp(5px,1vw,12px);justify-content:center;width:100%;flex-wrap:nowrap}
#selectScreen .choose-row button{margin:0;padding:7px clamp(8px,1.9vw,20px);background:#0c2451e8;color:#fff;border:2px solid #e5c878;font-size:clamp(12px,2.1vw,19px);flex:1;max-width:180px}
#selectScreen .choose-row button.picked{background:#cf6b21;border:3px solid #fff37a;box-shadow:0 0 17px #ffba45}
#selectScreen .menu-action{padding:7px 28px;font-size:clamp(14px,2.2vw,21px)}
#selectScreen .menu-bottom{background:#0b1930ac;padding:6px;border-radius:12px}
@media (orientation:portrait){.lobby-art{object-fit:contain;background:#07152c}#selectScreen .choose-row{flex-wrap:wrap}#selectScreen .choose-row button{flex:0 0 43%}.menu-bottom{bottom:max(16px,env(safe-area-inset-bottom))}}
</style></head><body><div id="titleScreen"><img class="lobby-art" src="/assets/title_online.webp" alt="熱血！ニャンコ大運動会"><div class="art-shade"></div><div class="menu-bottom"><button class="menu-action" onclick="showLobbySetup()">▶ ONLINE 2人対戦</button><div class="menu-sub">スマホ2台で3競技を勝ち抜こう！</div></div></div>
<div id="selectScreen"><img class="lobby-art" src="/assets/select_online.webp" alt="キャラクターセレクト"><div class="art-shade"></div><div class="menu-bottom"><div class="menu-sub" id="selectHelp">キャラを選択してください</div><div class="choose-row" id="artChoices"></div><button class="menu-action" id="artReady" onclick="send('ready')" disabled>このキャラで準備完了！</button></div></div><div id="lobby"><div id="card"><h1>🐱 熱血！ニャンコ大運動会</h1><p>原作ベース・オンライン大会 音声・操作修正版</p><div id="setup"><button onclick="send('create')">部屋を作る</button><input id="code" maxlength="6" placeholder="6桁コード"><button onclick="send('join',{code:document.getElementById('code').value})">参加</button></div><p id="status">接続中…</p><div class="choice" id="choices"></div><button id="ready" style="display:none" onclick="send('ready')">準備完了</button><div id="advance" style="display:none"><h2>競技終了</h2><button onclick="advance()">次の競技へ進む（1Pが操作）</button></div></div></div><iframe id="game" allow="fullscreen"></iframe><div id="notice"></div><button id="leave" onclick="location.reload()">退出</button><div id="pad"></div><div id="tugControls"><button id="remoteMash" type="button">連打！</button><button id="remoteRhythm" type="button">リズム！</button></div><div id="buttons"><button data-act="jump">ジャンプ</button><button data-act="punch">パンチ</button><button data-act="throw">投げ</button><button data-act="special">必殺</button></div>
<script>

// One shared mixer lives outside the replaceable competition iframe. Audio plays
// on both phones and music continues between sports.
const nyAudio=(()=>{
 const uri={bgm:'/assets/2974900eca1ba18c00af.mp3',airhorn:'/assets/52fa1acbbf51ebf2da5f.mp3',cheer:'/assets/6f086c4f6812ac855bf2.mp3',gong:'/assets/1cfed6d3dd64cc94c2e1.mp3',drum:'/assets/0fc22adf3e32c5738abd.mp3',sting:'/assets/7a1ccf08742d30a55666.mp3',levelup:'/assets/89facd35de53d39a172a.mp3',skateRide:'/assets/96ae78f2f668094446bf.mp3'};
 const bank={};for(const [k,u] of Object.entries(uri)){const a=new Audio(u);a.preload=k==='bgm'?'auto':'metadata';a.volume=k==='bgm'?.34:k==='skateRide'?.58:.8;a.loop=k==='bgm'||k==='skateRide';bank[k]=a;}
 let unlocked=false,ctx=null,rolling=false,rollSeq=0,skating=false;
 function unlock(){unlocked=true;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}catch(_){}const a=bank.bgm;if(a.paused)a.play().catch(()=>{});}
 function play(k){if(!unlocked)return;const a=bank[k];if(!a)return;try{a.pause();a.currentTime=0;a.play().catch(()=>{});}catch(_){} }
 function stop(k){const a=bank[k];if(a){a.pause();try{a.currentTime=0}catch(_){}}}
 function synth(type){if(!unlocked||!ctx)return;const t=ctx.currentTime, osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);const settings={jump:[500,820,.15],punch:[230,75,.10],impact:[130,48,.22],explosion:[80,32,.45],skate:[420,950,.34],headbutt:[130,700,.45],slaps:[280,95,.22],whirl:[500,200,.34],feign:[160,80,.22],start:[560,900,.28],select:[570,800,.09],good:[520,790,.14],perfect:[700,1100,.20],miss:[180,85,.20],mash:[260,330,.06]};
 const [f1,f2,len]=settings[type]||[400,560,.13];osc.type=type==='impact'||type==='explosion'?'sawtooth':'triangle';osc.frequency.setValueAtTime(f1,t);osc.frequency.exponentialRampToValueAtTime(Math.max(25,f2),t+len);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(type==='jump'||type==='skate'?.18:.13,t+.009);gain.gain.exponentialRampToValueAtTime(.0001,t+len);osc.start(t);osc.stop(t+len+.012);}
 function uploaded(type){if(type==='skateRideOn'){if(!skating){skating=true;play('skateRide');}return}if(type==='skateRideOff'){skating=false;stop('skateRide');return}
  if(type==='drum'){rolling=true;const seq=++rollSeq;play('drum');const drum=bank.drum;const done=()=>{if(seq===rollSeq&&rolling){rolling=false;play('sting')}};drum.onended=done;setTimeout(done,Math.ceil(((drum.duration||4.5)+.1)*1000));return}
  if(type==='sting'&&rolling)return;play(type);
 }
 document.addEventListener('pointerdown',unlock,{capture:true});document.addEventListener('keydown',unlock,{capture:true});
 return {unlock,play,stop,synth,uploaded};
})();

const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
const game=document.getElementById('game'),notice=document.getElementById('notice');let id=null,choices={},sport=0,finished=false,localStarted=false, room='',latestInput={x:0,y:0},lastSend=0,lastSnapshot=0,gameReady=false,pendingState=null;
const names=['まるねこ','でぶねこ','ダックス','もふねこ'];
let latestRoom=null;
function showLobbySetup(){nyAudio.unlock();nyAudio.synth('start');document.getElementById('titleScreen').style.display='none';document.getElementById('lobby').style.display='flex'}
function renderArtChoice(d){
 const el=document.getElementById('artChoices');
 el.innerHTML=names.map((n,i)=>`<button class="${d.choices[id]===i?'picked':''}" ${Object.entries(d.choices).some(([k,v])=>k!==id&&v===i)?'disabled':''} onclick="send('select',{character:${i}})">${n}</button>`).join('');
 const ready=document.getElementById('artReady');ready.disabled=d.choices[id]==null||!!d.ready?.[id];
 ready.textContent=d.ready?.[id]?'相手の準備を待っています…':'このキャラで準備完了！';
 document.getElementById('selectHelp').textContent=`部屋 ${d.code}　／　${d.players.length}/2人参加　／　キャラを選択`;
 document.getElementById('lobby').style.display='none';document.getElementById('titleScreen').style.display='none';document.getElementById('selectScreen').style.display='block';
}
let order=[],score=[0,0,0,0];
function send(type,extra={}){if(ws.readyState===1)ws.send(JSON.stringify({type,...extra}))}
ws.onopen=()=>document.getElementById('status').textContent='サーバー接続OK。部屋を作成するか参加してください';
ws.onclose=()=>{document.getElementById('status').textContent='接続が切れました。ページを再読み込みしてください';notice.textContent='通信が切れました';notice.style.display='block';};
ws.onmessage=async ev=>{let d=JSON.parse(ev.data);if(d.type==='error'){alert(d.message);return}if(d.type==='joined'){id=d.id;room=d.code}if(d.type==='room'){latestRoom=d;choices=d.choices;renderArtChoice(d);document.getElementById('status').textContent=`部屋番号 ${d.code} ／ 接続 ${d.players.join('＋')}`;document.getElementById('setup').style.display='none';document.getElementById('choices').innerHTML=names.map((n,i)=>`<button ${Object.entries(d.choices).some(([k,v])=>k!==id&&v===i)?'disabled':''} onclick="send('select',{character:${i}})">${n}${d.choices[id]===i?' ✔':''}</button>`).join('');document.getElementById('ready').style.display=d.choices[id]!=null?'inline-block':'none'}
if(d.type==='start'){nyAudio.unlock();nyAudio.uploaded('airhorn');document.getElementById('selectScreen').style.display='none';choices=d.choices;sport=0;await loadSport();}
if(d.type==='remote_input'&&id==='1P'&&!finished){game.contentWindow?.postMessage({source:'nyanko-net',type:'input',input:d.input},'*')}
if(d.type==='snapshot'&&id==='2P'&&sport===d.sport){pendingState=d.state;if(gameReady)game.contentWindow?.postMessage({source:'nyanko-net',type:'snapshot',state:d.state},'*')}
if(d.type==='complete'&&d.sport===sport&&!finished){nyAudio.uploaded('cheer');nyAudio.uploaded('skateRideOff');finished=true;order=d.order;game.style.display='none';document.getElementById('pad').style.display='none';document.getElementById('buttons').style.display='none';document.getElementById('tugControls').style.display='none';document.getElementById('lobby').style.display='flex';document.getElementById('status').textContent='競技結果：'+order.map((c,i)=>`${i+1}位 ${names[c]}`).join(' ／ ');order.forEach((c,i)=>score[c]+=[10,6,3,1][i]);document.getElementById('advance').style.display=id==='1P'?'block':'none';if(sport===2){document.getElementById('status').textContent+=' ／ 全競技終了！';document.getElementById('advance').style.display=id==='1P'?'block':'none';document.querySelector('#advance button').textContent='🏆 総合結果を発表';}}
if(d.type==='event'&&d.event==='next'){sport=Number.isInteger(d.sport)?d.sport:sport+1;finished=false;if(sport<=2)await loadSport();else showFinal();}
};
async function loadSport(){nyAudio.uploaded('skateRideOff');finished=false;gameReady=false;pendingState=null;const sources=['race','battle','tug'];let res=await fetch('/sports/'+sources[sport]+'.txt');if(!res.ok){alert('競技ファイルを読み込めません: '+res.status);return}let txt=await res.text();const me=choices[id],other=choices[id==='1P'?'2P':'1P'];txt=txt.replace('__PLAYER_ID__',String(me)).replace('__REMOTE_ID__',String(id==='1P'?other:-1));txt=txt.replace('<head>','<head><base href="/">');
 document.getElementById('lobby').style.display='none';game.style.display='block';game.srcdoc=txt;document.getElementById('pad').style.display=id==='2P'&&sport<2?'block':'none';document.getElementById('buttons').style.display=id==='2P'&&sport<2?'flex':'none';document.getElementById('tugControls').style.display=id==='2P'&&sport===2?'flex':'none';notice.style.display='block';notice.textContent=(id==='1P'?'1P：試合を判定':'2P：リモート操作')+' ／ '+['クロスカントリー','格闘大会','綱引き'][sport];document.getElementById('leave').style.display='block';document.getElementById('advance').style.display='none';
 game.onload=()=>{
 gameReady=true;const cw=game.contentWindow;
 if(id==='2P'){
   const originalControls=cw.document?.getElementById('controls');
   if(originalControls)originalControls.style.setProperty('display','none','important');
   const originalHelp=cw.document?.getElementById('help');
   if(originalHelp)originalHelp.style.setProperty('display','none','important');
   if(pendingState)cw.postMessage({source:'nyanko-net',type:'snapshot',state:pendingState},'*');
 }else{
   const btn=cw.document?.querySelector('#start');if(btn)btn.click();
 }
};}
function advance(){if(id==='1P')send('event',{event:'next'})}
function showFinal(){nyAudio.uploaded('drum');document.getElementById('selectScreen').style.display='none';finished=true;game.style.display='none';document.getElementById('lobby').style.display='flex';document.getElementById('advance').style.display='none';document.getElementById('pad').style.display='none';document.getElementById('buttons').style.display='none';document.getElementById('tugControls').style.display='none';const ranking=[0,1,2,3].sort((a,b)=>score[b]-score[a]||a-b);document.getElementById('status').innerHTML='<h2>🏆 総合成績発表</h2>'+ranking.map((c,i)=>'<p style="font-size:clamp(15px,3vw,24px)">'+(i===0?'👑 ':'')+(i+1)+'位 '+names[c]+'　'+score[c]+'点</p>').join('')+'<p>3競技すべて終了！</p>';}
window.addEventListener('message',e=>{if(e.source!==game.contentWindow||!e.data)return;const d=e.data;if(d.source==='nyanko-uploaded-audio'){nyAudio.uploaded(d.type);return}if(d.source==='nyanko-sfx'){nyAudio.synth(d.type);return}if(d.source==='nyanko-net-frame'&&d.type==='snapshot'&&id==='1P'&&!finished){const now=performance.now();if(now-lastSnapshot>65){lastSnapshot=now;send('snapshot',{sport:d.sport,state:d.state})}}
if(d.source==='nyanko-event'&&d.type==='complete'&&id==='1P'&&!finished){finished=true;send('complete',{sport:d.event,order:d.order})}});
function pushAct(act){if(id!=='2P'||finished||!gameReady)return;nyAudio.synth(act==='throw'?'punch':act);send('input',{input:{...latestInput,[act]:true}})}
for(const b of document.querySelectorAll('#buttons button'))b.addEventListener('pointerdown',e=>{e.preventDefault();pushAct(b.dataset.act)});
for(const [key,el] of [['mash','remoteMash'],['rhythm','remoteRhythm']])document.getElementById(el).addEventListener('pointerdown',e=>{e.preventDefault();nyAudio.synth(key==='mash'?'mash':'good');send('input',{input:{[key]:true}})},{passive:false});
const pad=document.getElementById('pad');let active=false;function move(e){let r=pad.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.42),y=(e.clientY-r.top-r.height/2)/(r.height*.42);let m=Math.max(1,Math.hypot(x,y));latestInput={x:x/m,y:y/m}}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);active=true;move(e)});pad.addEventListener('pointermove',e=>{if(active)move(e)});function stop(){active=false;latestInput={x:0,y:0};send('input',{input:latestInput})}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);window.addEventListener('blur',()=>{if(id==='2P')stop()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&id==='2P')stop()});
setInterval(()=>{if(id==='2P'&&!finished&&sport<2&&gameReady&&game.style.display==='block'&&ws.readyState===1&&ws.bufferedAmount<32768)send('input',{input:latestInput})},50);
</script></body></html>
