<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ニャンコ大運動会 原作オンライン再構築</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c33;color:white;font-family:system-ui}#lobby{height:100dvh;display:flex;align-items:center;justify-content:center;overflow:auto;background:linear-gradient(120deg,#1d345c,#153a58)}#card{width:min(640px,94vw);padding:24px;border:2px solid #e9bf6c;border-radius:25px;text-align:center;background:#172945f1}button,input{padding:13px;border-radius:12px;margin:5px;background:#efc86d;border:0;font-weight:bold}input{background:white}button{cursor:pointer}button:disabled{opacity:.4}.choice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.choice button{min-width:90px}#game{position:fixed;inset:0;width:100vw;height:100dvh;border:0;display:none;background:black}#pad{position:fixed;bottom:16px;left:16px;width:134px;height:134px;border:2px solid #fffc;border-radius:100px;background:#2b5575ac;display:none;touch-action:none;z-index:8}#buttons{position:fixed;bottom:18px;right:10px;display:none;gap:6px;z-index:8}#buttons button{border-radius:40px;background:#f1a547aa;color:white;font-size:13px;touch-action:none}#notice{position:fixed;top:7px;left:50%;transform:translateX(-50%);background:#10243fdf;border-radius:12px;padding:5px 12px;display:none;z-index:8;font-size:12px}#leave{position:fixed;top:8px;right:8px;display:none;z-index:9;font-size:12px}
#tugControls{position:fixed;bottom:15px;left:0;right:0;display:none;z-index:20;justify-content:space-around;pointer-events:none}#tugControls button{width:min(38vw,260px);height:92px;background:#e76c39;color:white;font-size:24px;box-shadow:0 6px #0009;touch-action:none;pointer-events:auto}#tugControls button:last-child{background:#7054d8}
</style></head><body><div id="lobby"><div id="card"><h1>🐱 熱血！ニャンコ大運動会</h1><p>原作ベース・オンライン大会 統合検証版</p><div id="setup"><button onclick="send('create')">部屋を作る</button><input id="code" maxlength="6" placeholder="6桁コード"><button onclick="send('join',{code:document.getElementById('code').value})">参加</button></div><p id="status">接続中…</p><div class="choice" id="choices"></div><button id="ready" style="display:none" onclick="send('ready')">準備完了</button><div id="advance" style="display:none"><h2>競技終了</h2><button onclick="advance()">次の競技へ進む（1Pが操作）</button></div></div></div><iframe id="game" allow="fullscreen"></iframe><div id="notice"></div><button id="leave" onclick="location.reload()">退出</button><div id="pad"></div><div id="tugControls"><button id="remoteMash" type="button">連打！</button><button id="remoteRhythm" type="button">リズム！</button></div><div id="buttons"><button data-act="jump">ジャンプ</button><button data-act="punch">パンチ</button><button data-act="throw">投げ</button><button data-act="special">必殺</button></div>
<script>
const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
const game=document.getElementById('game'),notice=document.getElementById('notice');let id=null,choices={},sport=0,finished=false,localStarted=false, room='',latestInput={x:0,y:0},lastSend=0,lastSnapshot=0,gameReady=false,pendingState=null;
const names=['まるねこ','でぶねこ','ダックス','もふねこ'];let order=[],score=[0,0,0,0];
function send(type,extra={}){if(ws.readyState===1)ws.send(JSON.stringify({type,...extra}))}
ws.onopen=()=>document.getElementById('status').textContent='サーバー接続OK。部屋を作成するか参加してください';
ws.onclose=()=>{document.getElementById('status').textContent='接続が切れました。ページを再読み込みしてください';notice.textContent='通信が切れました';notice.style.display='block';};
ws.onmessage=async ev=>{let d=JSON.parse(ev.data);if(d.type==='error'){alert(d.message);return}if(d.type==='joined'){id=d.id;room=d.code}if(d.type==='room'){choices=d.choices;document.getElementById('status').textContent=`部屋番号 ${d.code} ／ 接続 ${d.players.join('＋')}`;document.getElementById('setup').style.display='none';document.getElementById('choices').innerHTML=names.map((n,i)=>`<button ${Object.entries(d.choices).some(([k,v])=>k!==id&&v===i)?'disabled':''} onclick="send('select',{character:${i}})">${n}${d.choices[id]===i?' ✔':''}</button>`).join('');document.getElementById('ready').style.display=d.choices[id]!=null?'inline-block':'none'}
if(d.type==='start'){choices=d.choices;sport=0;await loadSport();}
if(d.type==='remote_input'&&id==='1P'&&!finished){game.contentWindow?.postMessage({source:'nyanko-net',type:'input',input:d.input},'*')}
if(d.type==='snapshot'&&id==='2P'&&sport===d.sport){pendingState=d.state;if(gameReady)game.contentWindow?.postMessage({source:'nyanko-net',type:'snapshot',state:d.state},'*')}
if(d.type==='complete'&&d.sport===sport){finished=true;order=d.order;game.style.display='none';document.getElementById('pad').style.display='none';document.getElementById('buttons').style.display='none';document.getElementById('tugControls').style.display='none';document.getElementById('lobby').style.display='flex';document.getElementById('status').textContent='競技結果：'+order.map((c,i)=>`${i+1}位 ${names[c]}`).join(' ／ ');order.forEach((c,i)=>score[c]+=[10,6,3,1][i]);document.getElementById('advance').style.display=id==='1P'?'block':'none';if(sport===2){document.getElementById('status').textContent+=' ／ 全競技終了！';document.getElementById('advance').style.display=id==='1P'?'block':'none';document.querySelector('#advance button').textContent='🏆 総合結果を発表';}}
if(d.type==='event'&&d.event==='next'){sport++;if(sport<=2)await loadSport();else showFinal();}
};
async function loadSport(){finished=false;gameReady=false;pendingState=null;const sources=['race','battle','tug'];let res=await fetch('/sports/'+sources[sport]+'.txt');if(!res.ok){alert('競技ファイルを読み込めません: '+res.status);return}let txt=await res.text();const me=choices[id],other=choices[id==='1P'?'2P':'1P'];txt=txt.replace('__PLAYER_ID__',String(me)).replace('__REMOTE_ID__',String(id==='1P'?other:-1));txt=txt.replace('<head>','<head><base href="/">');
 document.getElementById('lobby').style.display='none';game.style.display='block';game.srcdoc=txt;document.getElementById('pad').style.display=id==='2P'&&sport<2?'block':'none';document.getElementById('buttons').style.display=id==='2P'&&sport<2?'flex':'none';document.getElementById('tugControls').style.display=id==='2P'&&sport===2?'flex':'none';notice.style.display='block';notice.textContent=(id==='1P'?'1P：試合を判定':'2P：リモート操作')+' ／ '+['クロスカントリー','格闘大会','綱引き'][sport];document.getElementById('leave').style.display='block';document.getElementById('advance').style.display='none';
 game.onload=()=>{gameReady=true;const cw=game.contentWindow;const btn=cw.document?.querySelector('#start');if(id==='1P'&&btn)btn.click();else if(id==='2P'&&pendingState)cw.postMessage({source:'nyanko-net',type:'snapshot',state:pendingState},'*'); };}
function advance(){if(id==='1P')send('event',{event:'next'})}
function showFinal(){finished=true;game.style.display='none';document.getElementById('lobby').style.display='flex';document.getElementById('advance').style.display='none';document.getElementById('pad').style.display='none';document.getElementById('buttons').style.display='none';document.getElementById('tugControls').style.display='none';const ranking=[0,1,2,3].sort((a,b)=>score[b]-score[a]||a-b);document.getElementById('status').innerHTML='<h2>🏆 総合成績発表</h2>'+ranking.map((c,i)=>'<p style="font-size:clamp(15px,3vw,24px)">'+(i===0?'👑 ':'')+(i+1)+'位 '+names[c]+'　'+score[c]+'点</p>').join('')+'<p>3競技すべて終了！</p>';}
window.addEventListener('message',e=>{if(e.source!==game.contentWindow||!e.data)return;const d=e.data;if(d.source==='nyanko-net-frame'&&d.type==='snapshot'&&id==='1P'&&!finished){const now=performance.now();if(now-lastSnapshot>65){lastSnapshot=now;send('snapshot',{sport:d.sport,state:d.state})}}
if(d.source==='nyanko-event'&&d.type==='complete'&&id==='1P'&&!finished){finished=true;send('complete',{sport:d.event,order:d.order})}});
function pushAct(act){if(id!=='2P'||finished||!gameReady)return;send('input',{input:{...latestInput,[act]:true}})}
for(const b of document.querySelectorAll('#buttons button'))b.addEventListener('pointerdown',e=>{e.preventDefault();pushAct(b.dataset.act)});
for(const [key,el] of [['mash','remoteMash'],['rhythm','remoteRhythm']])document.getElementById(el).addEventListener('pointerdown',e=>{e.preventDefault();send('input',{input:{[key]:true}})},{passive:false});
const pad=document.getElementById('pad');let active=false;function move(e){let r=pad.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.42),y=(e.clientY-r.top-r.height/2)/(r.height*.42);let m=Math.max(1,Math.hypot(x,y));latestInput={x:x/m,y:y/m}}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);active=true;move(e)});pad.addEventListener('pointermove',e=>{if(active)move(e)});function stop(){active=false;latestInput={x:0,y:0};send('input',{input:latestInput})}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);window.addEventListener('blur',()=>{if(id==='2P')stop()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&id==='2P')stop()});
setInterval(()=>{if(id==='2P'&&!finished&&sport<2&&gameReady&&game.style.display==='block'&&ws.readyState===1&&ws.bufferedAmount<32768)send('input',{input:latestInput})},50);
</script></body></html>
